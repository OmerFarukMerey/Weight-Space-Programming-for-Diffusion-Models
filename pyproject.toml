[project]
name = "wspd"
version = "0.1.0"
description = "Can an LLM edit diffusion denoiser weights, without gradients, to recover few-step texture?"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "diffusers>=0.35",
  "transformers>=4.50",
  "accelerate>=1.0",
  "safetensors>=0.5",
  "lpips>=0.1.4",
  "numpy>=2.0",
  "scipy>=1.14",
  "pillow>=10",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsp = "wspd.cli:main"
wsp-sup = "wspd.supervisor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
